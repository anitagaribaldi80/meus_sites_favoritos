
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- Título exibido na aba do navegador -->
    <title>Meus sites favoritos</title>

    <!-- Estilização da página -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .site {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            width: 200px;
            box-shadow: 0 2px 8px #cccccc;
        }

        .site img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .site a {
            display: block;
            margin-top: 10px;
            color: #0066cc;
            text-decoration: none;
        }

        .site a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Título principal da página -->
    <h1>Meus sites favoritos: Seu Nome</h1>

    <!-- Área que contém os cinco sites favoritos -->
    <div class="container">

        <!-- Primeiro site: Google -->
        <div class="site">
            <h2>Google</h2>
            <img src="https://www.google.com/s2/favicons?domain=google.com&sz=128"
                 alt="Logo do Google">
            <a href="https://www.google.com" target="_blank">
                Acessar Google
            </a>
        </div>

        <!-- Segundo site: YouTube -->
        <div class="site">
            <h2>YouTube</h2>
            <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128"
                 alt="Logo do YouTube">
            <a href="https://www.youtube.com" target="_blank">
                Acessar YouTube
            </a>
        </div>

        <!-- Terceiro site: Instagram -->
        <div class="site">
            <h2>Instagram</h2>
            <img src="https://www.google.com/s2/favicons?domain=instagram.com&sz=128"
                 alt="Logo do Instagram">
            <a href="https://www.instagram.com" target="_blank">
                Acessar Instagram
            </a>
        </div>

        <!-- Quarto site: Wikipedia -->
        <div class="site">
            <h2>Wikipedia</h2>
            <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=128"
                 alt="Logo da Wikipedia">
            <a href="https://www.wikipedia.org" target="_blank">
                Acessar Wikipedia
            </a>
        </div>

        <!-- Quinto site: GitHub -->
        <div class="site">
            <h2>GitHub</h2>
            <img src="https://www.google.com/s2/favicons?domain=github.com&sz=128"
                 alt="Logo do GitHub">
            <a href="https://www.github.com" target="_blank">
                Acessar GitHub
            </a>
        </div>

    </div>

</body>
</html>
